name: Deploy design proposal to GitHub Pages

on:
  push:
    branches:
      - claude/eight-fields-redesign-9c64yk
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Requires Pages to be switched on once, in
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # `enablement: true` re-enables it automatically on later runs, but the
      # very first creation needs that manual step: GITHUB_TOKEN is not allowed
      # to create a Pages site from scratch.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        # base_path is "/<repo>" for a project site and "" for a user/org site.
        # The fallback keeps the build correct if the output is ever unset.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          base="${BASE_PATH:-/$REPO_NAME}"
          echo "building with base: $base/"
          python3 tools/build.py --base "$base/"

      - name: Verify build output
        run: |
          test -f docs/index.html
          echo "pages built:"
          find docs -name 'index.html' | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
